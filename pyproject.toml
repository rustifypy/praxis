[project]
name = "praxis"
version = "0.1.0"
description = "Agentic analytics over a self-hosted Cube Core semantic layer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langgraph>=1.2.10",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "pyjwt>=2.10",
    "rapidfuzz>=3.10",
    "langchain-openai>=1.4.1",
    "pyyaml>=6.0.3",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "aiosqlite>=0.22.1",
    # What FastAPI parses an upload with. Absent, `UploadFile` fails at request time rather
    # than at import, so the upload route would look like a working route until first use.
    "python-multipart>=0.0.20",
    "mcp>=2.0.0",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
praxis = "praxis.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

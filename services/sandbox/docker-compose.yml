# The code sandbox. Its own deployment, run wherever you like — it is not part of the semantic
# layer and shares nothing with it: no network, no volume, no secret.
#
# What it is: one container holding an analysis stack, one workspace per chat, and scripts over
# HTTP behind a bearer token.
#
#   SANDBOX_TOKEN   given to the workspace. It runs arbitrary Python, so this is required
#
# It holds no credential of its own — it cannot sign a Cube token and has no warehouse
# password — so there is no route through it to a number that did not come through the gate.
# It *can* reach the network, unlike a container with --network none: a script could send data
# it was already handed somewhere else. That is the price of it being a service, and the reason
# the port is bound to loopback and the token is not optional.

name: analyst-sandbox

services:
  sandbox:
    image: ${SANDBOX_IMAGE:-analyst-sandbox:1}
    build: .
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?required}
    # To move it, change the left-hand number only. The right-hand one is the port the service
    # listens on inside the container, and the two are not the same setting.
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-8600}:8600"
    volumes:
      - workspaces:/workspaces
    # Shared across chats, as they were when this was one container per machine: a script
    # exhausting either affects every chat, which is survivable because the workspace is state.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 512
    init: true
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL

volumes:
  workspaces:

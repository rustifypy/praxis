[project]
name = "sandbox-service"
version = "0.1.0"
description = "The code sandbox: one workspace per chat, scripts over HTTP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "python-multipart>=0.0.20",
]

[project.scripts]
sandbox-service = "sandbox_service.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    # The profiler's, not the service's — it is installed in the image and imported only by
    # the script that runs inside. Declared here so the suite actually covers profiling.
    "duckdb==1.1.3",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The semantic layer. Paste this wherever it should run — the same file serves a laptop and a
# server, because the workspace only ever talks to **one** URL here: the model store's.
#
# **The store is the only door.** Cube's port is not published; queries reach it through
# `model-store` at `/cube/...`, which mints Cube's JWT itself. So CUBEJS_API_SECRET never leaves
# this file, and CUBEJS_DEV_MODE=true disabling JWT verification is not a hole anything outside
# can reach.
#
# Cube Store is here because production mode makes it the queue/cache driver and refuses to run
# a query without it. Only CUBEJS_DEV_MODE=true embeds one.
#
#   MODEL_STORE_READ_TOKEN   given to Cube; reads the model, cannot query
#   MODEL_STORE_WRITE_TOKEN  given to the workspace; writes the model *and* queries
#   CUBEJS_API_SECRET        shared by cube and model-store, internal to this file
#
# The code sandbox is not here. It is its own deployment in `sandbox-service/`, sharing no
# network, volume or secret with this one — see that directory's compose file.

name: analyst-cube

services:
  model-store:
    image: ${STORE_IMAGE:-analyst-model-store:dev}
    build: ./store
    environment:
      MODEL_STORE_READ_TOKEN: ${MODEL_STORE_READ_TOKEN:?required}
      MODEL_STORE_WRITE_TOKEN: ${MODEL_STORE_WRITE_TOKEN:?required}
      # Where it proxies queries, and what it signs them with. Both internal to this file.
      CUBE_URL: http://cube:4000
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?required}
    ports:
      - "127.0.0.1:${MODEL_STORE_PORT:-8500}:8500"
    volumes:
      - model:/data

  cube:
    image: cubejs/cube:${CUBE_TAG:-latest}
    # Some drivers ship an amd64-only build; the portal's .env names the one to use.
    platform: ${CUBE_PLATFORM:-}
    depends_on: [model-store, cubestore]
    environment:
      CUBEJS_DB_TYPE: ${CUBEJS_DB_TYPE:?required}
      CUBEJS_DB_HOST: ${CUBEJS_DB_HOST:?required}
      CUBEJS_DB_PORT: ${CUBEJS_DB_PORT:-5432}
      CUBEJS_DB_NAME: ${CUBEJS_DB_NAME:?required}
      CUBEJS_DB_USER: ${CUBEJS_DB_USER:?required}
      CUBEJS_DB_PASS: ${CUBEJS_DB_PASS:?required}
      CUBEJS_DEV_MODE: ${CUBEJS_DEV_MODE:-false}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?required}
      CUBEJS_CUBESTORE_HOST: cubestore
      CUBEJS_CUBESTORE_PORT: 3030
      MODEL_STORE_URL: http://model-store:8500
      MODEL_STORE_TOKEN: ${MODEL_STORE_READ_TOKEN:?required}
    # Not published. Everything reaches Cube through the store at /cube/..., which is what
    # makes that the one authenticated door in — and what makes dev mode's disabled JWT check
    # harmless, since nothing outside this network can reach it.
    expose:
      - "4000"
    volumes:
      - ./cube.js:/cube/conf/cube.js:ro

  cubestore:
    # `latest` is amd64 only, so an Apple Silicon host needs CUBESTORE_TAG=arm64v8 — the pull
    # fails with "no matching manifest for linux/arm64/v8" rather than falling back.
    image: cubejs/cubestore:${CUBESTORE_TAG:-latest}
    environment:
      CUBESTORE_HTTP_PORT: 3030
    volumes:
      - cubestore:/cube/data

volumes:
  model:
  cubestore:

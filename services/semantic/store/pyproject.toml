[project]
name = "model-store"
version = "0.1.0"
description = "The data model: files, refs and history, over HTTP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
    # Cube is proxied through here, so this service signs its JWT and makes the call.
    "httpx>=0.28",
    "pyjwt>=2.10",
]

[project.scripts]
model-store = "model_store.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analyst</title>
    <!-- Theme before first paint; must match src/theme.ts (same key, same rule). -->
    <script>
      try {
        var theme = localStorage.getItem("analyst-theme");
      } catch (e) {}
      document.documentElement.dataset.schema =
        theme === "dark" ||
        (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
          ? "dark"
          : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
